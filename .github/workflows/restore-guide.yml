name: Restore guide modules
on:
  push:
    paths:
      - "guide/_restore/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble u1b.py and depth.py
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          m=json.loads(Path("guide/_restore/manifest.json").read_text())
          def assemble(name, n, digest):
              parts=[]
              for i in range(n):
                  parts.append(Path(f"guide/_restore/{name}/p{i:02d}.b64").read_text().strip())
              data=base64.b64decode("".join(parts))
              got=hashlib.sha256(data).hexdigest()
              if got!=digest:
                  raise SystemExit(f"{name} digest mismatch {got} != {digest}")
              target={"u1b":"guide/content/u1b.py","depth":"guide/depth.py"}[name]
              Path(target).write_bytes(data)
              print(target, len(data), got)
          assemble("u1b", m["u1b"], m["sha256_u1b"])
          assemble("depth", m["depth"], m["sha256_depth"])
          PY
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide/content/u1b.py guide/depth.py
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Restore u1b.py and depth.py from base64 parts."
          git push
