name: Assemble upload parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'guide/_upload/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble all upload targets from base64 parts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ.get('GITHUB_REPOSITORY', 'AbduraximSHER/sat-math')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'assemble-upload',
          }

          # Map upload dir slug -> destination path
          upload_root = Path('guide/_upload')
          # Prefer manifest if present
          manifest_path = upload_root / 'manifest.json'
          targets = []
          if manifest_path.exists():
              targets = json.loads(manifest_path.read_text())
          else:
              for d in sorted(upload_root.iterdir()):
                  if not d.is_dir():
                      continue
                  slug = d.name
                  if slug.startswith('content__'):
                      target = f"guide/content/{slug[len('content__'):]}.py"
                  else:
                      target = f"guide/{slug}.py"
                  targets.append({'slug': slug, 'target': target})

          def put_file(path: str, content: bytes, message: str):
              api = f'https://api.github.com/repos/{repo}/contents/{path}'
              sha = None
              req = urllib.request.Request(api + '?ref=main', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      sha = json.load(r)['sha']
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              body = {
                  'message': message,
                  'content': base64.b64encode(content).decode('ascii'),
                  'branch': 'main',
              }
              if sha:
                  body['sha'] = sha
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  api, data=data, method='PUT',
                  headers={**headers, 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req) as r:
                  out = json.load(r)
                  print('updated', out['content']['path'], 'size', out['content']['size'])

          for item in targets:
              slug = item['slug']
              target = item['target']
              parts_dir = upload_root / slug
              if not parts_dir.is_dir():
                  print('skip missing dir', slug)
                  continue
              chunks = []
              for p in sorted(parts_dir.glob('*.b64')):
                  chunks.append(base64.b64decode(p.read_text().strip()))
              if not chunks:
                  print('skip empty', slug)
                  continue
              data = b''.join(chunks)
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              Path(target).write_bytes(data)
              print(f'assembled {target} bytes {len(data)}')
              put_file(target, data, f'Assemble {target} from upload parts')
          PY
