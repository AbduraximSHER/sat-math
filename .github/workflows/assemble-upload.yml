name: Assemble upload parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'guide/_upload/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble gzip, bundle, and part uploads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, gzip, io, json, os, tarfile, urllib.request, urllib.error
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ.get('GITHUB_REPOSITORY', 'AbduraximSHER/sat-math')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'assemble-upload',
          }

          def api_json(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={**headers, **({'Content-Type':'application/json'} if body else {})})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def put_file(path: str, content: bytes, message: str):
              api = f'https://api.github.com/repos/{repo}/contents/{path}'
              sha = None
              try:
                  sha = api_json(api + '?ref=main')['sha']
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              body = {
                  'message': message,
                  'content': base64.b64encode(content).decode('ascii'),
                  'branch': 'main',
              }
              if sha:
                  body['sha'] = sha
              out = api_json(api, method='PUT', body=body)
              print('updated', out['content']['path'], 'size', out['content']['size'])

          def delete_file(path: str, message: str):
              api = f'https://api.github.com/repos/{repo}/contents/{path}'
              try:
                  meta = api_json(api + '?ref=main')
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return
                  raise
              body = {'message': message, 'sha': meta['sha'], 'branch': 'main'}
              api_json(api, method='DELETE', body=body)
              print('deleted', path)

          assembled = []

          # 0) tarball bundle
          bundle_dir = Path('guide/_upload/bundle')
          bundle_meta = Path('guide/_upload/bundle_meta.json')
          if bundle_dir.is_dir() and bundle_meta.exists():
              meta = json.loads(bundle_meta.read_text())
              expected = meta['parts']
              part_files = sorted(bundle_dir.glob('*.b64'))
              if len(part_files) >= expected:
                  b64 = ''.join(p.read_text().strip() for p in part_files)
                  raw = base64.b64decode(b64)
                  print(f'bundle bytes {len(raw)} from {len(part_files)} parts')
                  with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tar:
                      for m in tar.getmembers():
                          if not m.isfile():
                              continue
                          f = tar.extractfile(m)
                          data = f.read()
                          print(f'bundle extract {m.name} bytes {len(data)}')
                          put_file(m.name, data, f'Assemble {m.name} from guide bundle')
                          assembled.append(m.name)
                  for p in part_files:
                      delete_file(f'guide/_upload/bundle/{p.name}', f'Cleanup bundle part {p.name}')
              else:
                  print(f'skip incomplete bundle: {len(part_files)}/{expected}')

          # 1) gzip single-file uploads
          gz_dir = Path('guide/_upload/gz')
          if gz_dir.is_dir():
              for p in sorted(gz_dir.glob('*.gz.b64')):
                  slug = p.name[:-len('.gz.b64')]
                  if slug.startswith('content__'):
                      target = f"guide/content/{slug[len('content__'):]}.py"
                  else:
                      target = f"guide/{slug}.py"
                  try:
                      data = gzip.decompress(base64.b64decode(p.read_text().strip()))
                  except Exception as e:
                      print(f'skip corrupt gz {p.name}: {e}')
                      continue
                  print(f'gz assemble {target} bytes {len(data)}')
                  put_file(target, data, f'Assemble {target} from gzip upload')
                  assembled.append(target)
                  delete_file(f'guide/_upload/gz/{p.name}', f'Cleanup gz after assembling {target}')

          # 2) legacy multi-part uploads
          upload_root = Path('guide/_upload')
          manifest_path = upload_root / 'manifest.json'
          if manifest_path.exists():
              for item in json.loads(manifest_path.read_text()):
                  slug = item['slug']
                  target = item['target']
                  expected = item.get('parts')
                  parts_dir = upload_root / slug
                  if not parts_dir.is_dir():
                      continue
                  part_files = sorted(parts_dir.glob('*.b64'))
                  if expected and len(part_files) < expected:
                      print(f'skip incomplete {slug}: {len(part_files)}/{expected}')
                      continue
                  if not part_files:
                      continue
                  data = b''.join(base64.b64decode(p.read_text().strip()) for p in part_files)
                  print(f'part assemble {target} bytes {len(data)}')
                  put_file(target, data, f'Assemble {target} from upload parts')
                  assembled.append(target)
                  for p in part_files:
                      delete_file(f'guide/_upload/{slug}/{p.name}', f'Cleanup part after assembling {target}')

          # 3) content/* directories gated by EXPECTED
          content_root = Path('guide/_upload/content')
          if content_root.is_dir():
              for d in sorted(content_root.iterdir()):
                  if not d.is_dir():
                      continue
                  expected_path = d / 'EXPECTED'
                  if not expected_path.exists():
                      print(f'skip {d.name}: no EXPECTED')
                      continue
                  expected = int(expected_path.read_text().strip())
                  name = d.name
                  if name.startswith('guide_content_'):
                      target = f"guide/content/{name[len('guide_content_'):]}.py"
                  else:
                      target = f"guide/content/{name}.py"
                  part_files = sorted(d.glob('*.b64'))
                  if len(part_files) < expected:
                      print(f'skip incomplete {d.name}: {len(part_files)}/{expected}')
                      continue
                  data = b''.join(base64.b64decode(p.read_text().strip()) for p in part_files[:expected])
                  print(f'content assemble {target} bytes {len(data)} from {expected} parts')
                  put_file(target, data, f'Assemble {target} from content upload parts')
                  assembled.append(target)
                  for p in part_files[:expected]:
                      delete_file(f'guide/_upload/content/{d.name}/{p.name}', f'Cleanup part after assembling {target}')
                  delete_file(f'guide/_upload/content/{d.name}/EXPECTED', f'Cleanup EXPECTED after assembling {target}')

          print('assembled', assembled)
          PY
