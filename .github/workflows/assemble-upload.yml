name: Assemble upload parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'guide/_upload/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble bank.py from base64 parts
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          parts_dir = Path('guide/_upload/bank')
          chunks = []
          for p in sorted(parts_dir.glob('*.b64')):
              chunks.append(base64.b64decode(p.read_text().strip()))
          if not chunks:
              raise SystemExit('no parts')
          data = b''.join(chunks)
          Path('guide/bank.py').write_bytes(data)
          print('wrote guide/bank.py bytes', len(data))
          Path('/tmp/bank_size.txt').write_text(str(len(data)))
          PY
      - name: Commit via Contents API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, json, os, urllib.request
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ.get('GITHUB_REPOSITORY', 'AbduraximSHER/sat-math')
          path = 'guide/bank.py'
          content = open(path, 'rb').read()
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'assemble-upload',
          }
          req = urllib.request.Request(api + '?ref=main', headers=headers)
          with urllib.request.urlopen(req) as r:
              sha = json.load(r)['sha']
          body = json.dumps({
              'message': 'Assemble guide/bank.py from upload parts',
              'content': base64.b64encode(content).decode('ascii'),
              'sha': sha,
              'branch': 'main',
          }).encode()
          req = urllib.request.Request(api, data=body, method='PUT', headers={**headers, 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as r:
                  out = json.load(r)
                  print('updated', out['content']['path'], 'size', out['content']['size'])
          except urllib.error.HTTPError as e:
              print(e.read().decode())
              raise
          PY
