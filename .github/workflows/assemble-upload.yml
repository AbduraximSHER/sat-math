name: Assemble upload parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'guide/_upload/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and assemble complete guide modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, gzip, hashlib, io, json, os, tarfile, urllib.request, urllib.error
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ.get('GITHUB_REPOSITORY', 'AbduraximSHER/sat-math')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'assemble-upload',
          }

          def api_json(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={**headers, **({'Content-Type':'application/json'} if body else {})})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def put_file(path: str, content: bytes, message: str):
              api = f'https://api.github.com/repos/{repo}/contents/{path}'
              sha = None
              try:
                  sha = api_json(api + '?ref=main')['sha']
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              body = {
                  'message': message,
                  'content': base64.b64encode(content).decode('ascii'),
                  'branch': 'main',
              }
              if sha:
                  body['sha'] = sha
              out = api_json(api, method='PUT', body=body)
              print('updated', out['content']['path'], 'size', out['content']['size'])

          assembled = []

          # 0) remote tarball fetch (exact bytes, no MCP transcription)
          remote = Path('guide/_upload/remote_bundle.json')
          if remote.exists():
              meta = json.loads(remote.read_text())
              expected_sha = meta['sha256']
              expected_files = meta.get('files', {})
              data = None
              last_err = None
              for url in meta['urls']:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'assemble-upload'})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          data = r.read()
                      print(f'fetched {url} bytes {len(data)}')
                      break
                  except Exception as e:
                      last_err = e
                      print(f'fetch fail {url}: {e}')
              if data is None:
                  raise SystemExit(f'all fetches failed: {last_err}')
              got = hashlib.sha256(data).hexdigest()
              if got != expected_sha:
                  raise SystemExit(f'sha mismatch got={got} expected={expected_sha}')
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tar:
                  for m in tar.getmembers():
                      if not m.isfile():
                          continue
                      f = tar.extractfile(m)
                      content = f.read()
                      if expected_files and expected_files.get(m.name) and expected_files[m.name] != len(content):
                          raise SystemExit(f'size mismatch {m.name}: {len(content)} != {expected_files[m.name]}')
                      print(f'remote extract {m.name} bytes {len(content)}')
                      put_file(m.name, content, f'Fix complete guide modules: {m.name}')
                      assembled.append(m.name)

          # 1) gzip single-file uploads
          gz_dir = Path('guide/_upload/gz')
          if gz_dir.is_dir():
              for p in sorted(gz_dir.glob('*.gz.b64')):
                  slug = p.name[:-len('.gz.b64')]
                  if slug.startswith('content__'):
                      target = f"guide/content/{slug[len('content__'):]}.py"
                  else:
                      target = f"guide/{slug}.py"
                  try:
                      data = gzip.decompress(base64.b64decode(p.read_text().strip()))
                  except Exception as e:
                      print(f'skip corrupt gz {p.name}: {e}')
                      continue
                  print(f'gz assemble {target} bytes {len(data)}')
                  put_file(target, data, f'Assemble {target} from gzip upload')
                  assembled.append(target)

          # 2) legacy multi-part uploads
          upload_root = Path('guide/_upload')
          manifest_path = upload_root / 'manifest.json'
          if manifest_path.exists():
              for item in json.loads(manifest_path.read_text()):
                  slug = item['slug']
                  target = item['target']
                  expected = item.get('parts')
                  parts_dir = upload_root / slug
                  if not parts_dir.is_dir():
                      continue
                  part_files = sorted(parts_dir.glob('*.b64'))
                  if expected and len(part_files) < expected:
                      print(f'skip incomplete {slug}: {len(part_files)}/{expected}')
                      continue
                  if not part_files:
                      continue
                  data = b''.join(base64.b64decode(p.read_text().strip()) for p in part_files)
                  print(f'part assemble {target} bytes {len(data)}')
                  put_file(target, data, f'Assemble {target} from upload parts')
                  assembled.append(target)

          print('assembled', assembled)
          PY
