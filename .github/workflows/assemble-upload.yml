name: Assemble upload parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'guide/_upload/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble bank.py from base64 parts
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          parts_dir = Path('guide/_upload/bank')
          chunks = []
          for p in sorted(parts_dir.glob('*.b64')):
              chunks.append(base64.b64decode(p.read_text().strip()))
          if chunks:
              out = Path('guide/bank.py')
              data = b''.join(chunks)
              out.write_bytes(data)
              print('wrote', out, 'bytes', len(data))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Assemble guide/bank.py from upload parts"
            git push
          fi
