name: Deploy to Cloudflare Workers

# The live site is deployed by Cloudflare Workers Builds, which is connected to
# this repository in the Cloudflare dashboard. This workflow runs every check
# on main. It can also deploy from GitHub: add CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID as repository secrets and the deploy job switches on.
# Without them the deploy job skips itself and the run stays green.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A burst of pushes deploys once: newer runs wait, older pending runs are dropped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Only main deploys, even when the workflow is started by hand on a branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets. The site is deployed by Cloudflare Workers Builds."
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        working-directory: site
        run: npm ci

      - name: Build the Cloudflare worker
        if: steps.creds.outputs.ready == 'true'
        working-directory: site
        run: npx opennextjs-cloudflare build

      # `opennextjs-cloudflare deploy` copies the prerendered lessons into the
      # static-assets cache, then runs `wrangler deploy`.
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: site
        run: npx opennextjs-cloudflare deploy
